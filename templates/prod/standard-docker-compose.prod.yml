# -----------------------------------------------------------------------------
# {{APP_NAME_PROPER}} - Production Docker Compose (Swarm Mode)
#
# The app and queue services use the locally built image `{{APP_NAME}}:latest`.
# Laravel CMS media and database backups are S3-backed (MinIO) through Laravel disks;
# only storage/app private files and logs are host-backed.
# -----------------------------------------------------------------------------
services:

  db:
    image: mysql:8.4
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - "{{APP_NAME}}_network"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null | grep -q Uptime"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  app:
    image: "{{APP_NAME}}:latest"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 20s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M
    environment:
      PHP_FPM_ONLY: "1"
      SESSION_DRIVER: database
    volumes:
      - ${APP_STORAGE_HOST_PATH}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH}:/var/www/html/storage/logs
      - app_public:/var/www/public-files
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000);if(!$$s)exit(1);fclose($$s);'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      - db
    networks:
      - "{{APP_NAME}}_network"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  queue:
    image: "{{APP_NAME}}:latest"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command:
      - sh
      - -lc
      - |
        until php artisan migrate:status >/dev/null 2>&1; do
          echo "[queue] waiting for migrations to be ready..."
          sleep 5
        done
        exec php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --memory=128
    stop_grace_period: 120s
    volumes:
      - ${APP_STORAGE_HOST_PATH}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH}:/var/www/html/storage/logs
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_dir(\"storage/framework/views\") && is_writable(\"storage/framework/views\") && is_dir(\"storage/app\") && is_writable(\"storage/app\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - app
    networks:
      - "{{APP_NAME}}_network"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 10s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 60s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    ports:
      - target: 80
        published: 8012
        protocol: tcp
        mode: host
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      - app
    networks:
      - "{{APP_NAME}}_network"

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_HOST_PATH}
  app_public:

networks:
  "{{APP_NAME}}_network":
    driver: overlay
    attachable: true
