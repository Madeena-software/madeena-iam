name: "Download Database Backup"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        type: choice
        options:
          - "Download Latest"
          - "Download Specific"
          - "List Available Backups"
        default: "Download Latest"
      backup_name:
        description: "Filename (Only required if using 'Download Specific')"
        required: false
        type: string

concurrency:
  group: "{{APP_NAME}}-download-backup"
  cancel-in-progress: false

jobs:
  download-backup:
    name: Retrieve Backup
    runs-on: self-hosted
    
    steps:
      - name: Process Backups
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.MINIO_BUCKET }}
          AWS_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          APP_SLUG: "{{APP_NAME}}"
        run: |
          set -euo pipefail
          
          # Ensure workspace is clean before starting
          rm -f *.sql.gz
          
          ACTION="${{ github.event.inputs.action }}"
          BACKUP_INPUT="${{ github.event.inputs.backup_name }}"
          
          if [ "$ACTION" = "List Available Backups" ]; then
            echo "=== Available backups in S3 ==="
            docker run --rm \
              --entrypoint sh \
              -e AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY \
              -e AWS_ENDPOINT \
              minio/mc:latest -c "
                mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
                mc ls \"s3/$AWS_BUCKET/${APP_SLUG}-backups/\"
              " | grep '\.sql\.gz$' || echo "No backups found yet."
            echo "==============================="
            exit 0
          fi
          
          if [ "$ACTION" = "Download Specific" ]; then
            if [ -z "$BACKUP_INPUT" ]; then
              echo "ERROR: You selected 'Download Specific' but did not provide a filename."
              exit 1
            fi
            TARGET_FILE="$BACKUP_INPUT"
          else
            echo "Finding the latest backup..."
            TARGET_FILE=$(docker run --rm \
              --entrypoint sh \
              -e AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY \
              -e AWS_ENDPOINT \
              minio/mc:latest -c "
                mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
                mc ls \"s3/$AWS_BUCKET/${APP_SLUG}-backups/\"
              " | grep '\.sql\.gz$' | tail -n 1 | awk '{print $NF}')
          fi
          
          if [ -z "$TARGET_FILE" ]; then
            echo "No backups found!"
            exit 1
          fi
          
          echo "Downloading $TARGET_FILE from S3 to runner..."
          
          docker run --rm \
            --entrypoint sh \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_ENDPOINT \
            -v "$PWD:/workspace" \
            minio/mc:latest -c "
              mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
              mc cp \"s3/$AWS_BUCKET/${APP_SLUG}-backups/$TARGET_FILE\" \"/workspace/$TARGET_FILE\"
            "
            
          echo "TARGET_FILE=$TARGET_FILE" >> $GITHUB_ENV
          
          echo "✅ Backup successfully downloaded to runner!"
          
          echo "### 📦 Database Backup Ready" >> $GITHUB_STEP_SUMMARY
          echo "The database backup **$TARGET_FILE** has been successfully fetched." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "It is securely attached to this workflow run as an **Artifact**. Scroll to the bottom of this page to download it." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(Note: GitHub limits minimum artifact retention to 1 day. This file will auto-delete tomorrow.)*" >> $GITHUB_STEP_SUMMARY

      - name: Upload Backup Artifact
        if: env.TARGET_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: ${{ env.TARGET_FILE }}
          retention-days: 1
