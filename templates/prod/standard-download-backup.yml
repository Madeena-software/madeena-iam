name: "Download Database Backup"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        type: choice
        options:
          - "Download Latest"
          - "Download Specific"
          - "List Available Backups"
        default: "Download Latest"
      backup_name:
        description: "Filename (Only required if using 'Download Specific')"
        required: false
        type: string

concurrency:
  group: "{{APP_NAME}}-download-backup"
  cancel-in-progress: false

jobs:
  download-backup:
    name: Retrieve Backup
    runs-on: self-hosted
    
    steps:
      - name: Process Backups
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.MINIO_BUCKET }}
          AWS_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          APP_SLUG: "{{APP_NAME}}"
        run: |
          set -euo pipefail
          
          # Ensure workspace is clean before starting
          rm -f *.sql.gz
          
          ACTION="${{ github.event.inputs.action }}"
          BACKUP_INPUT="${{ github.event.inputs.backup_name }}"
          
          if [ "$ACTION" = "List Available Backups" ]; then
            echo "=== Available backups in S3 ==="
            docker run --rm \
              --entrypoint sh \
              -e AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY \
              -e AWS_ENDPOINT \
              minio/mc:latest -c "
                mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
                mc ls \"s3/$AWS_BUCKET/${APP_SLUG}-backups/\"
              " | grep '\.sql\.gz$' || echo "No backups found yet."
            echo "==============================="
            exit 0
          fi
          
          if [ "$ACTION" = "Download Specific" ]; then
            if [ -z "$BACKUP_INPUT" ]; then
              echo "ERROR: You selected 'Download Specific' but did not provide a filename."
              exit 1
            fi
            TARGET_FILE="$BACKUP_INPUT"
          else
            echo "Finding the latest backup..."
            TARGET_FILE=$(docker run --rm \
              --entrypoint sh \
              -e AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY \
              -e AWS_ENDPOINT \
              minio/mc:latest -c "
                mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
                mc ls \"s3/$AWS_BUCKET/${APP_SLUG}-backups/\"
              " | grep '\.sql\.gz$' | tail -n 1 | awk '{print $NF}')
          fi
          
          if [ -z "$TARGET_FILE" ]; then
            echo "No backups found!"
            exit 1
          fi
          
          echo "Generating presigned URL for $TARGET_FILE..."
          
          # mc share output format is usually: URL: https://...
          PRESIGNED_URL=$(docker run --rm \
            --entrypoint sh \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_ENDPOINT \
            minio/mc:latest -c "
              mc alias set s3 \"\$AWS_ENDPOINT\" \"\$AWS_ACCESS_KEY_ID\" \"\$AWS_SECRET_ACCESS_KEY\" --api S3v4 >/dev/null && \
              mc share download --expire 1h \"s3/$AWS_BUCKET/${APP_SLUG}-backups/$TARGET_FILE\"
            " | grep '^URL:' | awk '{print $2}')
            
          if [ -z "$PRESIGNED_URL" ]; then
             echo "Failed to generate presigned URL!"
             exit 1
          fi

          echo "✅ Backup is ready for download!"
          echo "Download URL (Valid for 1 hour): $PRESIGNED_URL"
          
          echo "### 📦 Database Backup Ready" >> $GITHUB_STEP_SUMMARY
          echo "The database backup **$TARGET_FILE** is ready for download." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Download Backup (.sql.gz)]($PRESIGNED_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Link expires in 1 hour. Do not share this link with unauthorized users.*" >> $GITHUB_STEP_SUMMARY
