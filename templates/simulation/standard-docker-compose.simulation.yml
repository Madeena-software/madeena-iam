# ─────────────────────────────────────────────────────────────────────────────
# {{APP_NAME_PROPER}} — Production Simulation (Docker Compose)
# ─────────────────────────────────────────────────────────────────────────────
# ALWAYS run via:  scripts/simulate-prod.sh
# Or manually:     docker compose --env-file .env.simulation -f docker-compose.simulation.yml <cmd>
#
# The --env-file flag is REQUIRED for compose variable substitution to work.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL 8.4 — starts first, all others depend on it ───────────────────────
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sim_db_data:/var/lib/mysql
    networks:
      - sim_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null | grep -q Uptime"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── Laravel PHP-FPM application ──────────────────────────────────────────────
  # entrypoint runs: migrate --force, config:cache, route:cache, then php-fpm
  # Queue MUST wait for this to be healthy before starting (migrations race condition).
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: simulation
    environment:
      PHP_FPM_ONLY: "1"
    volumes:
      - sim_app_storage:/var/www/html/storage
      - sim_app_public:/var/www/public-files
      - ./storage/enterprise_data_local:/var/www/enterprise_data
    env_file:
      - .env.simulation
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000);if(!$$s)exit(1);fclose($$s);'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sim_network

  # ── Laravel queue worker ─────────────────────────────────────────────────────
  # Depends on APP (not DB) so it starts only after migrations have been applied.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: simulation
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-jobs=100"]
    stop_grace_period: 30s
    volumes:
      - sim_app_storage:/var/www/html/storage
      - ./storage/enterprise_data_local:/var/www/enterprise_data
    env_file:
      - .env.simulation
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sim_network

  # ── Nginx web server ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8010:80"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - sim_app_public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sim_network

volumes:
  sim_db_data:
  sim_app_storage:
  sim_app_public:

networks:
  sim_network:
    driver: bridge

