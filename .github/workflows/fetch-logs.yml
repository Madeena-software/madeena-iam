name: Fetch Server Logs
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: self-hosted
    steps:
      - name: App Laravel Logs
        run: |
          CONTAINER=$(docker ps -qf name=madeena-iam_app | head -n1)
          if [ -n "$CONTAINER" ]; then
            docker exec $CONTAINER tail -n 200 /var/www/html/storage/logs/laravel.log 2>&1 || true
          else
            echo "Container not found"
          fi
