name: Update Super Admin
on: workflow_dispatch
jobs:
  update:
    runs-on: self-hosted
    steps:
      - name: Update Admin via Tinker
        run: |
          CONTAINER=$(docker ps -qf name=madeena-iam_app | head -n1)
          if [ -n "$CONTAINER" ]; then
            docker exec $CONTAINER php artisan tinker --execute="\$user = \App\Models\User::firstOrCreate(['email' => 'faliqadlan67@gmail.com'], ['name' => 'Super Admin', 'password' => \Illuminate\Support\Facades\Hash::make('madeenaadmin')]); \$user->update(['password' => \Illuminate\Support\Facades\Hash::make('madeenaadmin')]); \$user->assignRole('super_admin'); echo 'Admin updated and role assigned successfully!';";
          else
            echo "Container not found"
          fi
