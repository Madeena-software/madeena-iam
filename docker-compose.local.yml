# =============================================================================
# Madeena IAM — Local Development Infrastructure (Docker Compose)
# =============================================================================
# Hybrid architecture: only infrastructure services run in Docker.
# PHP, Composer, and NPM run natively on the WSL host for maximum performance.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d       # Start
#   docker compose -f docker-compose.local.yml down         # Stop
#   docker compose -f docker-compose.local.yml down -v      # Stop + delete data
# =============================================================================

services:
  db:
    image: mysql:8.4
    container_name: madeena-iam-mysql-local
    environment:
      MYSQL_DATABASE: madeena-iam
      MYSQL_USER: madeena-iam
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      # Bind to loopback only — PHP on WSL connects via 127.0.0.1:3310
      - "127.0.0.1:3310:3306"
    volumes:
      # Named volume keeps data outside the repo directory
      - madeena-iam_mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null | grep -q Uptime"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  madeena-iam_mysql_local:
